<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="accentBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="book1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    
    <linearGradient id="book2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="book3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />

  <!-- Ambient Decorative Circles -->
  <circle cx="250" cy="150" r="180" fill="#0284c7" opacity="0.12" filter="blur(60px)" />
  <circle cx="950" cy="600" r="220" fill="#6366f1" opacity="0.12" filter="blur(80px)" />

  <!-- Dashboard Container -->
  <rect x="80" y="60" width="1040" height="630" rx="24" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="2" />

  <!-- Header Bar -->
  <rect x="80" y="60" width="1040" height="70" rx="24" fill="#1e293b" fill-opacity="0.6" />
  <circle cx="120" cy="95" r="7" fill="#ef4444" />
  <circle cx="144" cy="95" r="7" fill="#f59e0b" />
  <circle cx="168" cy="95" r="7" fill="#10b981" />
  
  <text x="600" y="102" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    📚 BOOK RECOMMENDER SYSTEM | COSINE SIMILARITY ML ENGINE
  </text>

  <!-- Search & Filter Bar -->
  <rect x="130" y="160" width="600" height="48" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="160" y="190" font-family="system-ui, sans-serif" font-size="15" fill="#94a3b8">Search book by title or genre: "Hands-On Machine Learning..."</text>
  <rect x="750" y="160" width="180" height="48" rx="12" fill="url(#accentBtn)" />
  <text x="840" y="190" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Find Similar Books</text>

  <!-- Stats Pills -->
  <rect x="950" y="160" width="120" height="48" rx="12" fill="#1e293b" stroke="#334155" />
  <text x="1010" y="189" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">98.4% Match</text>

  <!-- Section Title -->
  <text x="130" y="250" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f1f5f9">
    Recommended For You (Based on Reading Vector Patterns)
  </text>

  <!-- Book Card 1 -->
  <g transform="translate(130, 270)">
    <rect width="280" height="370" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5" />
    <rect x="20" y="20" width="240" height="180" rx="12" fill="url(#book1)" />
    <text x="140" y="105" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">PYTHON ML</text>
    <text x="140" y="130" font-family="system-ui, sans-serif" font-size="12" fill="#fef3c7" text-anchor="middle">Scikit-Learn &amp; TensorFlow</text>
    
    <text x="20" y="230" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Python ML Masterclass</text>
    <text x="20" y="252" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Similarity Index: 0.985</text>
    
    <rect x="20" y="270" width="85" height="24" rx="6" fill="#3b82f6" fill-opacity="0.2" />
    <text x="62" y="286" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#60a5fa" text-anchor="middle">AI &amp; Data</text>

    <rect x="115" y="270" width="95" height="24" rx="6" fill="#10b981" fill-opacity="0.2" />
    <text x="162" y="286" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">High Affinity</text>

    <rect x="20" y="312" width="240" height="38" rx="8" fill="url(#accentBtn)" />
    <text x="140" y="336" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Explore Recommendations</text>
  </g>

  <!-- Book Card 2 -->
  <g transform="translate(460, 270)">
    <rect width="280" height="370" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="2" />
    <rect x="20" y="20" width="240" height="180" rx="12" fill="url(#book2)" />
    <text x="140" y="105" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">DEEP LEARNING</text>
    <text x="140" y="130" font-family="system-ui, sans-serif" font-size="12" fill="#e0f2fe" text-anchor="middle">Neural Networks &amp; Vision</text>
    
    <text x="20" y="230" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Deep Learning Architecture</text>
    <text x="20" y="252" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Similarity Index: 0.972</text>
    
    <rect x="20" y="270" width="95" height="24" rx="6" fill="#0284c7" fill-opacity="0.25" />
    <text x="67" y="286" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Top Match</text>

    <rect x="125" y="270" width="85" height="24" rx="6" fill="#8b5cf6" fill-opacity="0.2" />
    <text x="167" y="286" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">Algorithms</text>

    <rect x="20" y="312" width="240" height="38" rx="8" fill="url(#accentBtn)" />
    <text x="140" y="336" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Explore Recommendations</text>
  </g>

  <!-- Book Card 3 -->
  <g transform="translate(790, 270)">
    <rect width="280" height="370" rx="16" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5" />
    <rect x="20" y="20" width="240" height="180" rx="12" fill="url(#book3)" />
    <text x="140" y="105" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">GEN AI &amp; LLMS</text>
    <text x="140" y="130" font-family="system-ui, sans-serif" font-size="12" fill="#fce7f3" text-anchor="middle">Transformers &amp; Agents</text>
    
    <text x="20" y="230" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Generative AI Systems</text>
    <text x="20" y="252" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Similarity Index: 0.954</text>
    
    <rect x="20" y="270" width="95" height="24" rx="6" fill="#ec4899" fill-opacity="0.2" />
    <text x="67" y="286" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f472b6" text-anchor="middle">NLP &amp; LLMs</text>

    <rect x="125" y="270" width="85" height="24" rx="6" fill="#10b981" fill-opacity="0.2" />
    <text x="167" y="286" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">Trending</text>

    <rect x="20" y="312" width="240" height="38" rx="8" fill="url(#accentBtn)" />
    <text x="140" y="336" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Explore Recommendations</text>
  </g>
</svg>
