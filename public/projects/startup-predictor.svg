<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="btnGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="metricCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bgGrad2)" />

  <!-- Ambient Glow -->
  <circle cx="900" cy="200" r="220" fill="#38bdf8" opacity="0.1" filter="blur(80px)" />
  <circle cx="300" cy="550" r="200" fill="#818cf8" opacity="0.1" filter="blur(80px)" />

  <!-- Outer Dashboard Panel -->
  <rect x="70" y="60" width="1060" height="630" rx="24" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="2" />

  <!-- Header Bar -->
  <rect x="70" y="60" width="1060" height="70" rx="24" fill="#1e293b" fill-opacity="0.7" />
  <circle cx="110" cy="95" r="7" fill="#ef4444" />
  <circle cx="134" cy="95" r="7" fill="#f59e0b" />
  <circle cx="158" cy="95" r="7" fill="#10b981" />
  
  <text x="600" y="102" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
    🚀 AI STARTUP SUCCESS PREDICTOR | PREDICTIVE ML ANALYTICS
  </text>

  <!-- Left Stats & Metrics Column -->
  <g transform="translate(110, 160)">
    <!-- Metric 1 -->
    <rect width="280" height="110" rx="16" fill="url(#metricCard)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="24" y="42" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">PREDICTED SUCCESS SCORE</text>
    <text x="24" y="82" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#38bdf8">94.2%</text>
    <text x="160" y="80" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399">▲ +18.4% YoY</text>

    <!-- Metric 2 -->
    <rect y="130" width="280" height="110" rx="16" fill="url(#metricCard)" stroke="#334155" stroke-width="1" />
    <text x="24" y="172" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">ESTIMATED VALUATION</text>
    <text x="24" y="212" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#f8fafc">$14.8M</text>
    <text x="175" y="210" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Series A Ready</text>

    <!-- Metric 3 -->
    <rect y="260" width="280" height="110" rx="16" fill="url(#metricCard)" stroke="#334155" stroke-width="1" />
    <text x="24" y="302" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">ML CONFIDENCE RATING</text>
    <text x="24" y="342" font-family="system-ui, sans-serif" font-size="32" font-weight="800" fill="#a78bfa">High (0.941)</text>

    <!-- Run Prediction CTA -->
    <rect y="390" width="280" height="52" rx="12" fill="url(#btnGrad2)" />
    <text x="140" y="423" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#030712" text-anchor="middle">Run New AI Evaluation</text>
  </g>

  <!-- Right Chart & Analytics Panel -->
  <g transform="translate(420, 160)">
    <rect width="670" height="490" rx="20" fill="url(#metricCard)" stroke="#334155" stroke-width="1.5" />
    
    <text x="30" y="45" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f8fafc">
      Growth Trajectory &amp; ML Classification Curve
    </text>
    <text x="30" y="70" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
      Trained on 10,000+ Startup Funding &amp; Growth Datasets (Scikit-Learn Random Forest)
    </text>

    <!-- Chart Grid Lines -->
    <line x1="60" y1="120" x2="620" y2="120" stroke="#334155" stroke-dasharray="4 4" />
    <line x1="60" y1="180" x2="620" y2="180" stroke="#334155" stroke-dasharray="4 4" />
    <line x1="60" y1="240" x2="620" y2="240" stroke="#334155" stroke-dasharray="4 4" />
    <line x1="60" y1="300" x2="620" y2="300" stroke="#334155" stroke-dasharray="4 4" />
    <line x1="60" y1="360" x2="620" y2="360" stroke="#334155" stroke-width="1.5" />

    <!-- Chart Area Fill -->
    <path d="M 60 360 L 60 290 Q 180 250 280 210 T 480 140 T 620 100 L 620 360 Z" fill="url(#chartGrad)" />

    <!-- Chart Line -->
    <path d="M 60 290 Q 180 250 280 210 T 480 140 T 620 100" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

    <!-- Data Nodes -->
    <circle cx="60" cy="290" r="6" fill="#38bdf8" />
    <circle cx="200" cy="245" r="6" fill="#38bdf8" />
    <circle cx="340" cy="185" r="6" fill="#38bdf8" />
    <circle cx="480" cy="140" r="6" fill="#38bdf8" />
    <circle cx="620" cy="100" r="8" fill="#818cf8" stroke="#ffffff" stroke-width="2" />

    <!-- X-Axis Labels -->
    <text x="60" y="390" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Seed</text>
    <text x="200" y="390" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Pre-Series A</text>
    <text x="340" y="390" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Series A</text>
    <text x="480" y="390" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Series B</text>
    <text x="620" y="390" font-family="system-ui, sans-serif" font-size="12" fill="#38bdf8" font-weight="700" text-anchor="middle">Scale</text>

    <!-- Key Feature Badges -->
    <g transform="translate(60, 420)">
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="80" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">⚡ Random Forest Classifier</text>

      <rect x="180" y="0" width="160" height="36" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="260" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">📊 Valuation Regression</text>

      <rect x="360" y="0" width="160" height="36" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="440" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">🎯 Feature Importance</text>
    </g>
  </g>
</svg>
