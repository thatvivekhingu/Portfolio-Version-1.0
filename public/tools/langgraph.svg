<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="20" fill="#0f172a"/>
  <!-- Graph Nodes and Edges -->
  <line x1="30" y1="30" x2="70" y2="30" stroke="#f43f5e" stroke-width="4"/>
  <line x1="30" y1="30" x2="50" y2="75" stroke="#a855f7" stroke-width="4"/>
  <line x1="70" y1="30" x2="50" y2="75" stroke="#3b82f6" stroke-width="4"/>
  
  <circle cx="30" cy="30" r="12" fill="#f43f5e"/>
  <circle cx="70" cy="30" r="12" fill="#3b82f6"/>
  <circle cx="50" cy="75" r="12" fill="#a855f7"/>
  
  <circle cx="30" cy="30" r="5" fill="#ffffff"/>
  <circle cx="70" cy="30" r="5" fill="#ffffff"/>
  <circle cx="50" cy="75" r="5" fill="#ffffff"/>
</svg>
